[package]
name = "image-viewer"
version = "0.1.0"
description = "A minimal local image gallery"
authors = ["Muthukrishnan"]
license = "MIT"
repository = "https://github.com/muthuspark/images-viewer"
edition = "2021"

[lib]
name = "image_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
