name: Release Linux
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake nasm clang libasound2-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev libssl-dev libxcb-shape0-dev libxcb-xfixes0-dev patchelf
      - name: Validate tag and check application
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Download AppImage packager
        run: |
          curl --fail --location --retry 3 https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o "$RUNNER_TEMP/linuxdeploy.AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy.AppImage"
      - name: Build Linux packages
        run: LINUXDEPLOY="$RUNNER_TEMP/linuxdeploy.AppImage" scripts/package-linux.sh
      - uses: actions/attest@v4
        with:
          subject-path: |
            target/bundle/*.deb
            target/bundle/*.AppImage
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/bundle/*.deb target/bundle/*.AppImage target/bundle/SHA256SUMS --verify-tag --draft --title "Image Viewer $GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
